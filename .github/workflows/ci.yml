name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Data quality dry run
        run: python scripts/clean_data.py --check > /tmp/quality.json
      - name: Eval harness smoke test
        run: python scripts/run_eval.py --backend mock --limit 3 --out-dir /tmp/eval_mock
