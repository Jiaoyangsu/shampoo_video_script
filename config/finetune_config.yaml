# 训练配置
model:
  name: "unsloth/DeepSeek-R1-Distill-Qwen-1.5B"   # 基础模型
  use_4bit: true                                   # QLoRA 量化
  max_seq_length: 2048

lora:
  r: 16
  alpha: 16
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  batch_size: 2
  gradient_accumulation: 4          # 等效 batch = 2*4 = 8
  epochs: 4
  learning_rate: 1.0e-4
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  output_dir: "./outputs"

data:
  train_file: "data/train/shampoo_train.json"
  val_file: "data/val/shampoo_val.json"

dpo:
  beta: 0.1                         # DPO 温度参数
  learning_rate: 5.0e-6
  epochs: 3
