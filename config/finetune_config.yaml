# Single source of truth for the Gemma 3 SFT + DPO pipeline.
# Override paths on the server with CLI flags, e.g.
#   python src/finetune/gemma3/finetune_sft.py --base-model /root/.../gemma-3-12b-it
model:
  base_model: "google/gemma-3-12b-it"
  max_seq_length: 2048
  load_in_4bit: true
  attn_implementation: "sdpa"

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

data:
  # Output of: python scripts/clean_data.py
  train_file: "data/clean/shampoo_train.json"
  val_file: "data/clean/shampoo_val.json"
  dpo_train_file: "data/clean/dpo_train.json"
  dpo_val_file: "data/clean/dpo_val.json"

sft:
  output_dir: "outputs/gemma3_sft"
  epochs: 2
  batch_size: 1
  grad_accum: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.1
  weight_decay: 0.01
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3

dpo:
  output_dir: "outputs/gemma3_dpo"
  epochs: 1
  batch_size: 1
  grad_accum: 8
  learning_rate: 5.0e-6
  beta: 0.1
  warmup_ratio: 0.1
  max_length: 1536
  max_prompt_length: 768
  precompute_ref_batch_size: 1
  logging_steps: 5
  eval_steps: 50
  save_steps: 50
  save_total_limit: 3
